<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body{ font-family: Arial, Helvetica, sans-serif; margin: 50px; background-color: aquamarine;}
        input, select, button{ padding: 20px; margin: 20px; font-size: 16px;}
        #result{ margin-top: 15px; font-weight: bold; font-size: 18;}
    </style>
    <title>Document</title>
</head>
<body>
    <h1>Simple calculator</h1>
    <input type="number" id="num1" placeholder="First Number">

    <select name="" id="operator">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
    </select>

    <input type="number" id="num2" placeholder="Second Number">
    <button onclick="chakata()">Calcuate</button>

    <div id="result"></div>

    <script>
        function chakata(){
            let n1 = parseFloat(document.getElementById('num1').value);
            let n2 = parseFloat(document.getElementById('num2').value);
            let op = document.getElementById('operator').value;
            let output = document.getElementById('result');

            if (isNaN(n1) || isNaN(n2)){
                output.innerText = "Hahahaha U dumb biach!";
                return;
            }

            let result;

            if (op === '+'){
                result = n1 + n2;
            }
            else if(op === '-'){
                result = n1 - n2;
            }
            else if (op === '*'){
                result = n1 * n2;
            }
            else if(op === '/'){
                if(n2 === 0){
                    output.innerText = "Error: Don't be dumb biach!";
                    return;
                }
                result = n1 / n2;
            }
            output.innerText = "Result = " + result;
        }
    </script>
</body>
</html>
